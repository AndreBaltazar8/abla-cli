name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AndreBaltazar8/ablac
          path: ablac
      - run: ablac/tools/bootstrap-compiler.sh "$RUNNER_TEMP/ablac"
      - run: make test COMPILER="$RUNNER_TEMP/ablac"
