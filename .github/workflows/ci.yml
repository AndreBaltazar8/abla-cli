name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AndreBaltazar8/ablac
          path: ablac
      - run: make -C ablac build
      - run: make test ABLAC_DIR="$GITHUB_WORKSPACE/ablac"
