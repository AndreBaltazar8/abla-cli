name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AndreBaltazar8/ablac
          path: ablac
      - name: Test with the pinned bootstrap compiler
        run: |
          ablac/tools/bootstrap-compiler.sh "$PWD/build/ablac-bootstrap"
          make test COMPILER="$PWD/build/ablac-bootstrap"
