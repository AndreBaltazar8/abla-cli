name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: actions/checkout@v4
        with:
          repository: AndreBaltazar8/ablac
          path: ablac
      - name: Build current Abla compiler
        run: nix-shell ablac/shell.nix --run "make -C ablac"
      - name: Test package
        run: |
          nix-shell ablac/shell.nix --run "make test COMPILER='$PWD/ablac/build/ablac'"
